<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1a" />
  <meta name="description" content="FuturePath — Learn and master real skills across West Africa. Structured curricula from orientation to professional mastery." />
  <title>FuturePath — Skill Mastery Platform</title>
  <link rel="manifest" href="/manifest.json" />

  <!-- PWA mobile web app capable (modern) -->
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- PWA iOS -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FuturePath" />

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <!-- Styles -->
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>

  <!-- App shell -->
  <div id="app">

    <!-- Top navigation -->
    <header id="topbar">
      <div class="brand" id="brandHome">
        <span class="brand-mark"></span>
        <div class="brand-text">
          <strong>FuturePath</strong>
          <span>Skill Mastery Platform</span>
        </div>
      </div>
      <div class="top-controls">
        <button id="myLearningBtn" class="btn btn-ghost" title="My learning">
          My Learning <span id="learningCount" class="pill">0</span>
        </button>
        <button id="settingsBtn" class="btn btn-ghost btn-icon" title="Settings">⚙</button>
      </div>
    </header>

    <!-- Breadcrumb -->
    <nav id="breadcrumb" class="hidden">
      <button id="crumbBack" class="btn btn-link">← Back</button>
      <span id="crumbPath"></span>
    </nav>

    <!-- Main view container -->
    <main id="view" role="main"></main>

    <!-- Toast -->
    <div id="toast" class="hidden"></div>

    <!-- Loading -->
    <div id="loader">
      <div class="loader-ring"></div>
      <span>Loading FuturePath…</span>
    </div>

  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
